[package]
name = "statement-renderer"
version = "0.3.1"
edition = "2021"
rust-version = "1.75"
description = "Renders a statement PDF from a ledger snapshot."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tokio = "1.35"
tracing = { git = "https://github.com/tokio-rs/tracing" }
acme-shared = { path = "../shared" }
reqwest = { version = "0.11", optional = true }

[dependencies.sqlx]
version = "0.7"
features = ["postgres", "runtime-tokio"]

[dev-dependencies]
criterion = "0.5"

[build-dependencies]
cc = "1.0"

[target.'cfg(unix)'.dependencies]
nix = "0.27"

[[bin]]
name = "statementd"
path = "src/main.rs"
